name: ci

on:
  workflow_dispatch:

jobs:
  probe:
    name: Store compression
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Mount the store of the last image on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35192369769 -n rift-image-67be392e431e9b432e8305f13ad71dd4e2fa3816 -D img
          sudo apt-get install -y zstd bc >/dev/null
          zstd -d --rm img/rift.raw.zst -o img/rift.raw
          loop=$(sudo losetup --find --show --read-only --partscan img/rift.raw)
          sleep 2
          lsblk -o NAME,SIZE,PARTLABEL "$loop"
          part=$(lsblk -nrpo NAME,PARTLABEL "$loop" | awk '$2 ~ /^store_/ { print $1 }')
          sudo modprobe erofs || true
          sudo mkdir -p /mnt/store
          sudo mount -t erofs -o ro "$part" /mnt/store
          sudo du -sb /mnt/store
          ls /mnt/store/nix/store | sort > image-names.txt
          wc -l image-names.txt
          df -h /
      - name: erofs-utils from the flake's nixpkgs
        run: |
          nix build --inputs-from . nixpkgs#erofs-utils -o erofs
          erofs/bin/mkfs.erofs --version || true
      - name: Add the new packages
        run: |
          nix-store -r $(cat .github/probe-paths.txt) >/dev/null
          nix path-info -r $(cat .github/probe-paths.txt) | sed 's|^/nix/store/||' | sort -u > new-names.txt
          comm -23 new-names.txt image-names.txt > extra-names.txt
          wc -l new-names.txt extra-names.txt
          sudo mkdir -p /tmp/extra /tmp/union
          while read -r name; do sudo cp -al "/nix/store/$name" /tmp/extra/; done < extra-names.txt
          sudo du -sb /tmp/extra
          sudo mount -t overlay overlay -o lowerdir=/mnt/store/nix/store:/tmp/extra /tmp/union
          sudo mkdir -p /tmp/root/nix/store
          sudo mount --bind /tmp/union /tmp/root/nix/store
          sudo du -sb /tmp/root
          df -h /
      - name: Compress the store with them
        run: |
          try() {
            name=$1 source=$2
            shift 2
            start=$(date +%s)
            if sudo erofs/bin/mkfs.erofs --quiet -U 5a3b1c2d-0000-4000-8000-000000000001 "$@" "/tmp/$name.erofs" "$source"; then
              size=$(stat -c %s "/tmp/$name.erofs")
              echo "$name: $size bytes, $(numfmt --to=iec-i --suffix=B "$size"), $(( $(date +%s) - start )) s" | tee -a results.txt
            else
              echo "$name: mkfs.erofs failed after $(( $(date +%s) - start )) s" | tee -a results.txt
            fi
          }
          readspeed() {
            name=$1
            [ -f "/tmp/$name.erofs" ] || return 0
            dev=$(sudo losetup --find --show --read-only "/tmp/$name.erofs")
            sudo mkdir -p /mnt/try
            sudo mount -t erofs -o ro "$dev" /mnt/try
            sync
            echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null
            start=$(date +%s.%N)
            bytes=$(sudo tar -C /mnt/try -cf - . | wc -c)
            end=$(date +%s.%N)
            echo "read $name: $bytes bytes in $(echo "$end - $start" | bc) s" | tee -a results.txt
            sudo umount /mnt/try
            sudo losetup -d "$dev"
            sudo rm -f "/tmp/$name.erofs"
          }
          try none /tmp/root
          readspeed none
          try zstd3-64k /tmp/root -zzstd,level=3 -C65536
          readspeed zstd3-64k
          try zstd3-4k /tmp/root -zzstd,level=3
          readspeed zstd3-4k
          try store-zstd3-64k /mnt/store -zzstd,level=3 -C65536
          rm -f /tmp/store-zstd3-64k.erofs
          try store-zstd3-256k /mnt/store -zzstd,level=3 -C262144
          rm -f /tmp/store-zstd3-256k.erofs
          try store-zstd3-48bit /mnt/store -zzstd,level=3 -E48bit
          rm -f /tmp/store-zstd3-48bit.erofs
          try store-zstd3-48bit-64k /mnt/store -zzstd,level=3 -E48bit -C65536
          rm -f /tmp/store-zstd3-48bit-64k.erofs
          try store-zstd9-48bit-64k /mnt/store -zzstd,level=9 -E48bit -C65536
          rm -f /tmp/store-zstd9-48bit-64k.erofs
          try store-zstd3-64k-ztail /mnt/store -zzstd,level=3 -C65536 -Eztailpacking
          rm -f /tmp/store-zstd3-64k-ztail.erofs
          echo >> "$GITHUB_STEP_SUMMARY"
          cat results.txt >> "$GITHUB_STEP_SUMMARY"
