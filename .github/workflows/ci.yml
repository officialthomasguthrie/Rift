name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: pdftotext in a sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: A small pdf
        run: python3 tools/probe-pdf.py letter.pdf
      - name: What pdftotext writes with no sandbox at all
        run: |
          set -x
          pdftotext=$(nix shell --inputs-from . nixpkgs#poppler-utils -c sh -c 'command -v pdftotext')
          echo "pdftotext=$pdftotext"
          "$pdftotext" -q -enc UTF-8 -eol unix -l 200 letter.pdf - | od -c | tail -5
      - name: In the sandbox, the store alone
        run: |
          set -x
          pdftotext=$(nix shell --inputs-from . nixpkgs#poppler-utils -c sh -c 'command -v pdftotext')
          pdftotext=$(readlink -f "$pdftotext")
          bwrap=$(nix shell --inputs-from . nixpkgs#bubblewrap -c sh -c 'command -v bwrap')
          file=$PWD/letter.pdf
          set +e
          "$bwrap" --unshare-all --unshare-user --disable-userns --die-with-parent --new-session \
            --ro-bind /nix/store /nix/store --proc /proc --dev /dev --tmpfs /tmp --tmpfs /home \
            --ro-bind "$file" "$file" --chdir /tmp \
            -- "$pdftotext" -q -enc UTF-8 -eol unix -l 200 "$file" - > store-only.txt 2> store-only.err
          echo "exit=$?"
          set -e
          echo "--- stdout"
          od -c store-only.txt | tail -6
          echo "--- stderr"
          cat store-only.err
          grep -q "insurance card" store-only.txt && echo "STORE ONLY: the text came out"
      - name: In the sandbox with /etc as well, for comparison
        run: |
          set -x
          pdftotext=$(nix shell --inputs-from . nixpkgs#poppler-utils -c sh -c 'command -v pdftotext')
          pdftotext=$(readlink -f "$pdftotext")
          bwrap=$(nix shell --inputs-from . nixpkgs#bubblewrap -c sh -c 'command -v bwrap')
          file=$PWD/letter.pdf
          set +e
          "$bwrap" --unshare-all --unshare-user --disable-userns --die-with-parent --new-session \
            --ro-bind /nix/store /nix/store --ro-bind-try /etc /etc --proc /proc --dev /dev \
            --tmpfs /tmp --tmpfs /home \
            --ro-bind "$file" "$file" --chdir /tmp \
            -- "$pdftotext" -q -enc UTF-8 -eol unix -l 200 "$file" - > with-etc.txt 2> with-etc.err
          echo "exit=$?"
          set -e
          echo "--- stdout"
          od -c with-etc.txt | tail -6
          echo "--- stderr"
          cat with-etc.err
      - name: No network in there, and nothing else of home
        run: |
          set -x
          bwrap=$(nix shell --inputs-from . nixpkgs#bubblewrap -c sh -c 'command -v bwrap')
          curl=$(readlink -f "$(nix shell --inputs-from . nixpkgs#curl -c sh -c 'command -v curl')")
          coreutils=$(nix shell --inputs-from . nixpkgs#coreutils -c sh -c 'command -v ls')
          coreutils=$(readlink -f "$coreutils")
          file=$PWD/letter.pdf
          set +e
          "$bwrap" --unshare-all --unshare-user --disable-userns --die-with-parent --new-session \
            --ro-bind /nix/store /nix/store --proc /proc --dev /dev --tmpfs /tmp --tmpfs /home \
            --ro-bind "$file" "$file" --chdir /tmp \
            -- "$curl" -s -m 5 -o /dev/null https://example.com
          echo "curl exit=$? (a failure is what this wants)"
          "$bwrap" --unshare-all --unshare-user --disable-userns --die-with-parent --new-session \
            --ro-bind /nix/store /nix/store --proc /proc --dev /dev --tmpfs /tmp --tmpfs /home \
            --ro-bind "$file" "$file" --chdir /tmp \
            -- "$coreutils" -la "$HOME"
          echo "ls of home exit=$? (a failure is what this wants)"
