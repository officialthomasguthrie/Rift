name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: pdftotext in a sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: What this machine says about user namespaces
        run: |
          set -x
          cat /etc/os-release | head -3
          uname -r
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
          cat /proc/sys/kernel/unprivileged_userns_clone || true
          cat /proc/self/attr/apparmor/current || true
          aa-enabled || true
          ls /etc/apparmor.d/ | head -20 || true
      - name: A small pdf
        run: python3 tools/probe-pdf.py letter.pdf
      - name: Can an unprivileged user namespace bring up loopback at all
        run: |
          set -x
          set +e
          unshare -U -r -n sh -c 'ip link set lo up; echo "lo up=$?"'
          echo "unshare exit=$?"
      - name: The sandbox as it is, before anything is changed
        run: |
          set -x
          bash tools/probe-sandbox.sh store-only
          echo "store only exit=$?"
      - name: The same with apparmor's restriction on user namespaces off
        run: |
          set -x
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          set +e
          bash tools/probe-sandbox.sh free-store-only
          echo "store only exit=$?"
          bash tools/probe-sandbox.sh with-etc --ro-bind-try /etc /etc
          echo "with etc exit=$?"
      - name: And nothing else in there, with the restriction still off
        run: |
          set -x
          bwrap=$(nix shell --inputs-from . nixpkgs#bubblewrap -c sh -c 'command -v bwrap')
          curl=$(readlink -f "$(nix shell --inputs-from . nixpkgs#curl -c sh -c 'command -v curl')")
          coreutils=$(readlink -f "$(nix shell --inputs-from . nixpkgs#coreutils -c sh -c 'command -v ls')")
          file=$PWD/letter.pdf
          set +e
          "$bwrap" --unshare-all --unshare-user --disable-userns --die-with-parent --new-session \
            --ro-bind /nix/store /nix/store --proc /proc --dev /dev --tmpfs /tmp --tmpfs /home \
            --ro-bind "$file" "$file" --chdir /tmp \
            -- "$curl" -s -m 5 -o /dev/null https://example.com
          echo "curl exit=$? (a failure is what this wants)"
          "$bwrap" --unshare-all --unshare-user --disable-userns --die-with-parent --new-session \
            --ro-bind /nix/store /nix/store --proc /proc --dev /dev --tmpfs /tmp --tmpfs /home \
            --ro-bind "$file" "$file" --chdir /tmp \
            -- "$coreutils" -la "$HOME"
          echo "ls of home exit=$? (a failure is what this wants)"
