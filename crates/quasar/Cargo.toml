[package]
name = "quasar"
description = "Quasar: the local AI service daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "quasard"
path = "src/main.rs"

[dependencies]
# the model manifest is librift's, the same list the AI page reads
librift = { workspace = true, features = ["models"] }
# the answers come out of llama-server's json
serde.workspace = true
serde_json.workspace = true
# the system bus. blocking takes a question to the model off the bus's own threads
zbus = { version = "5.18", default-features = false, features = ["async-io", "blocking-api"] }
blocking = "1.6"

[lints]
workspace = true
