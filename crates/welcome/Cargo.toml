[package]
name = "welcome"
description = "Welcome: what a new drive shows its owner once, and the apps Rift suggests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "rift-welcome"
path = "src/main.rs"

[dependencies]
# the theme, the accent and the wallpaper the Appearance page writes, NetworkManager on the system
# bus, flatpak and the list of apps Rift suggests
librift = { workspace = true, features = ["bus", "suggested"] }
# the colours, the rows and the icons Settings draws with too
rift-ui = { workspace = true }

# a normal window, drawn in software like the shell so no gpu driver is needed, which can close
# while apps go on installing. svg draws the symbolic icons and the image widget the mark, which
# ships as png, read by the png reader alone
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "thread-pool", "wayland", "svg", "image-without-codecs", "advanced"] }
image = { version = "0.25.9", default-features = false, features = ["png"] }

[lints]
workspace = true
