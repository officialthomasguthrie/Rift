[package]
name = "settings"
description = "Settings: the Rift settings app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "rift-settings"
path = "src/main.rs"

[dependencies]
# the theme, the accent and the wallpaper the Appearance page writes, and what About reads off the
# system bus from Orbit
librift = { workspace = true, features = ["bus"] }

# a normal window, drawn in software like the shell so no gpu driver is needed. svg draws the
# symbolic icons of the sidebar, each in one colour, and the image widget the logo mark on the
# About page, which ships as png. iced's image feature would read every format there is, so the
# reader is named here with png alone
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "thread-pool", "wayland", "svg", "image-without-codecs", "advanced"] }
image = { version = "0.25.9", default-features = false, features = ["png"] }

[lints]
workspace = true
