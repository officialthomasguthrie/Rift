[package]
name = "lens"
description = "Lens: the Rift desktop shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "lens"
path = "src/main.rs"

[dependencies]
# questions go to quasard on the system bus
librift = { workspace = true, features = ["bus"] }

# the dock follows horizon's windows and workspaces over its ipc socket
niri-ipc = { path = "../horizon/niri-ipc" }

# the shell needs a wayland session and layer-shell, so it only exists on linux. the software
# renderer is the one that works on every machine, so wgpu stays out
# svg draws the symbolic icons of the Adwaita theme in the bar, each in one colour, and the image
# widget draws the app icons that ship as png, which most of them do. iced's image feature would
# read every format there is, which is a hundred crates and the avif and jpeg xl encoders; the
# icon themes hold png and svg, so the reader is named here with png alone. advanced is iced's
# text layout, which a notification's words are measured with to cut them to three lines
[target.'cfg(target_os = "linux")'.dependencies]
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "wayland", "thread-pool", "svg", "image-without-codecs", "advanced"] }
image = { version = "0.25.9", default-features = false, features = ["png"] }
iced_layershell = { version = "0.19.1", default-features = false }
# the notification server on the session bus, the same zbus librift asks the system bus with
zbus = { version = "5.18", default-features = false, features = ["async-io", "blocking-api"] }

[lints]
workspace = true
