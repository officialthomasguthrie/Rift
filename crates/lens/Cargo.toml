[package]
name = "lens"
description = "Lens: the Rift desktop shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "lens"
path = "src/main.rs"

[dependencies]
# questions go to quasard on the system bus
librift = { workspace = true, features = ["bus"] }

# the shell needs a wayland session and layer-shell, so it only exists on linux. the software
# renderer is the one that works on every machine, so wgpu stays out
# svg draws the symbolic icons of the Adwaita theme in the bar, each in one colour
[target.'cfg(target_os = "linux")'.dependencies]
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "wayland", "thread-pool", "svg"] }
iced_layershell = { version = "0.19.1", default-features = false }

[lints]
workspace = true
