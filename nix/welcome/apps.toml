# the apps rift suggests and never installs by itself. welcome lists them on its apps page, nothing
# ticked, and installs the ones the owner ticks from flathub into the system installation. each
# app is on flathub unless it names another remote, and an app from another remote is only listed
# on a machine that has that remote. account says the app is of no use without an account with
# the company that makes it

[[app]]
id = "net.mullvad.MullvadBrowser"
name = "Mullvad Browser"
about = "A private browser from Mullvad and the Tor Project, without Tor"
group = "Internet and privacy"

[[app]]
id = "org.torproject.torbrowser-launcher"
name = "Tor Browser"
about = "Browse over the Tor network"
group = "Internet and privacy"

